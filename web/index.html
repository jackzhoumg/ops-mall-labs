<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ops-mall 运维实战商城</title>
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
    header { padding: 20px 32px; color: #fff; background: linear-gradient(135deg, #1e293b, #312e81); }
    header h1 { margin: 0; font-size: 22px; }
    header small { opacity: .75; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .price { color: #dc2626; font-weight: 700; font-size: 18px; }
    .stock { color: #666; font-size: 13px; }
    button { margin-top: 10px; padding: 6px 14px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; }
    #msg { margin: 12px 0; min-height: 20px; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>ops-mall 运维实战商城</h1>
    <small id="ver">后端版本：加载中…</small>
  </header>
  <main>
    <div id="msg"></div>
    <div class="grid" id="list"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const yuan = (c) => '¥' + (c / 100).toFixed(2);

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
      return body;
    }

    async function loadVersion() {
      try {
        const v = await api('/api/version');
        $('ver').textContent = '后端版本：' + v.version + '　实例：' + v.hostname;
      } catch (e) {
        $('ver').textContent = '后端不可用：' + e.message;
      }
    }

    async function loadProducts() {
      try {
        const list = await api('/api/products');
        $('list').innerHTML = '';
        for (const p of list) {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = '<div></div><div class="price"></div><div class="stock"></div><button>下单 1 件</button>';
          div.children[0].textContent = p.name;
          div.children[1].textContent = yuan(p.price_cents);
          div.children[2].textContent = '库存 ' + p.stock;
          div.querySelector('button').onclick = () => order(p.id);
          $('list').appendChild(div);
        }
      } catch (e) {
        $('msg').innerHTML = '';
        const s = document.createElement('span');
        s.className = 'err';
        s.textContent = '加载商品失败：' + e.message;
        $('msg').appendChild(s);
      }
    }

    async function order(id) {
      try {
        const o = await api('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: id, quantity: 1 }),
        });
        $('msg').textContent = '下单成功，订单号 ' + o.id + '，金额 ' + yuan(o.amount_cents);
        loadProducts();
      } catch (e) {
        $('msg').textContent = '下单失败：' + e.message;
      }
    }

    loadVersion();
    loadProducts();
  </script>
</body>
</html>
