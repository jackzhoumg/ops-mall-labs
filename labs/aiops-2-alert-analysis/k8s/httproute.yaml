# AIOps-2：只把 /feedback 和 /stats 暴露到 alert-analyzer.lab.local，/alertmanager 不对外（只给集群内的 Alertmanager 调）。
# Gateway 和 Lab 09 一样：envoy-gateway-system 命名空间的 lab-gateway，名字不同就改 parentRefs。
# 学员电脑 hosts：192.168.56.200  alert-analyzer.lab.local
# 注意：反馈链接没有登录校验，只适合内网。生产要放在公司 SSO 后面，或者改成企业微信 / 钉钉的交互卡片回调。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alert-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-analyzer
    app.kubernetes.io/part-of: ops-mall
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
  hostnames:
    - alert-analyzer.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /feedback/
        - path:
            type: Exact
            value: /stats
      backendRefs:
        - name: alert-analyzer
          port: 8080
