# AIOps-2：大模型密钥和群机器人地址。复制成 secret.yaml 填好后 kubectl apply -f k8s/secret.yaml。
# secret.yaml 已在 .gitignore 里，不要提交到 Git；用 GitOps 管理时按 Lab 08 的办法做成 SealedSecret。
#
# LLM_BASE_URL：OpenAI 兼容接口地址，以 /v1 结尾（云厂商大模型平台的兼容模式，或者集群内私有化部署的 vLLM / Ollama）
# 机器人地址都不填时进入演练模式：消息只打印在 Pod 日志里。
apiVersion: v1
kind: Secret
metadata:
  name: alert-analyzer-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-analyzer
type: Opaque
stringData:
  LLM_BASE_URL: "https://llm.example.com/v1"
  LLM_API_KEY: "sk-REPLACE_ME"
  LLM_MODEL: "your-chat-model"
  WECOM_WEBHOOK: ""
  DINGTALK_WEBHOOK: ""
  DINGTALK_SECRET: ""
