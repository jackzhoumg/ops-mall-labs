# 思路二：按业务指标（每个 Pod 的 RPS）扩缩容，用 KEDA 的 Prometheus scaler。
# 写作时版本：KEDA v2.21.1，文档 https://keda.sh/docs/2.21/scalers/prometheus/ ，以官方最新文档为准。
#
# KEDA 会自动创建并管理一个名为 keda-hpa-mall-api 的 HPA。
# 应用前先删掉思路一的 HPA：kubectl -n mall delete hpa mall-api
#
# 用法（k8s-master）：kubectl apply -f k8s/keda-scaledobject.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mall-api
  namespace: mall
  labels:
    app.kubernetes.io/name: mall-api
    app.kubernetes.io/part-of: ops-mall
spec:
  scaleTargetRef:
    name: mall-api
  minReplicaCount: 2        # 不缩到 0：商城接口要随时响应，缩到 0 冷启动会丢请求
  maxReplicaCount: 6
  pollingInterval: 15       # 每 15 秒查一次 Prometheus
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    # 主指标：业务接口总 RPS。prometheus 触发器默认按 AverageValue 计算：
    # 期望副本数 = ceil(查询结果 / threshold)，threshold 就是“每个 Pod 承担多少 RPS”。
    # 120 = 压测得到的单实例容量（约 180 RPS）× 目标水位 0.7 取整，换成你自己的压测结果。
    - type: prometheus
      name: rps
      metadata:
        # kube-prometheus-stack 的 Prometheus Service，release 名不同就改
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[2m]))
        threshold: "120"
        # Prometheus 查不到数据时报错，而不是当成 0（当成 0 会在 Prometheus 故障时把副本缩到最小）
        ignoreNullValues: "false"
    # 兜底：CPU 也不能太高（多个触发器取副本数最大的那个）
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
