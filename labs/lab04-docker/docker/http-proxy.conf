# dockerd 走公司 HTTP 代理拉外网镜像（systemd drop-in）
# 放到 /etc/systemd/system/docker.service.d/http-proxy.conf，然后：
#   systemctl daemon-reload && systemctl restart docker
#   systemctl show docker --property=Environment
#
# 代理地址换成你们公司 / 自己境外服务器上的代理。NO_PROXY 一定要包含内网仓库，否则推 Harbor 也会走代理
[Service]
Environment="HTTP_PROXY=http://proxy.example.internal:3128"
Environment="HTTPS_PROXY=http://proxy.example.internal:3128"
Environment="NO_PROXY=localhost,127.0.0.1,192.168.56.0/24,.lab.local"
