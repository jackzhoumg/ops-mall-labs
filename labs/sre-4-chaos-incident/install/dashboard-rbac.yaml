# Chaos Dashboard 登录用的账号：只能在 mall 命名空间管理混沌实验。
# 生成登录 token：kubectl create token chaos-operator -n mall --duration=8h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-operator
  namespace: mall
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-operator
  namespace: mall
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-operator
  namespace: mall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-operator
subjects:
  - kind: ServiceAccount
    name: chaos-operator
    namespace: mall
