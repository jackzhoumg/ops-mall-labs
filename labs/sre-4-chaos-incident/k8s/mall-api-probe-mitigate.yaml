# 止损用的临时补丁：就绪探针改查 /healthz（只看进程在不在，不查 MySQL / Redis）。
# 依赖变慢时 Pod 不会被全部摘掉，服务“慢但可用”。这是临时措施，事后必须评审并换成正式方案（复盘改进项 AI-1 / AI-5）。
# 用法：kubectl -n mall patch deployment mall-api --patch-file k8s/mall-api-probe-mitigate.yaml
spec:
  template:
    spec:
      containers:
        - name: mall-api
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
