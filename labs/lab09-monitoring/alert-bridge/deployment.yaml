# Lab 09：alert-bridge 部署清单（Deployment + Service）
# 镜像用官方 python:3.13-slim，脚本通过 ConfigMap 挂进去，不用自己构建镜像。
# 国内拉 Docker Hub 慢的话，先推到 Harbor：harbor.lab.local/library/python:3.13-slim，再改下面的 image。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-bridge
    app.kubernetes.io/part-of: ops-mall
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-bridge
        app.kubernetes.io/part-of: ops-mall
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-bridge
          image: python:3.13-slim
          command: ["python3", "-u", "/app/bridge.py"]
          ports:
            - name: http
              containerPort: 8080
          # 机器人地址放在 Secret 里（见 secret.example.yaml）。Secret 不存在时 optional 让 Pod 照常启动，进入演练模式。
          envFrom:
            - secretRef:
                name: alert-bridge-robots
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: alert-bridge-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-bridge
spec:
  selector:
    app.kubernetes.io/name: alert-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
