# Lab 09：机器人地址 Secret 示例。复制成 secret.yaml，填好后 kubectl apply -f secret.yaml。
# secret.yaml 不要提交到 Git（webhook 地址里的 key 泄露了，任何人都能往你们群里发消息）。
#
# 企业微信：群聊 → 右上角 … → 消息推送（群机器人）→ 添加，复制 Webhook 地址
# 钉钉：群设置 → 机器人 → 添加机器人 → 自定义，安全设置选"加签"，复制 Webhook 地址和 SEC 开头的密钥
#
# 变量名规则：路径 /wecom/ops 对应 WECOM_WEBHOOK_OPS，/dingtalk/oncall 对应 DINGTALK_WEBHOOK_ONCALL。
# 某个变量不填，对应路径就是演练模式：消息只打印在 alert-bridge 的日志里。
apiVersion: v1
kind: Secret
metadata:
  name: alert-bridge-robots
  namespace: monitoring
type: Opaque
stringData:
  WECOM_WEBHOOK_OPS: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=替换成运维群机器人的key"
  WECOM_WEBHOOK_ONCALL: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=替换成值班群机器人的key"
  DINGTALK_WEBHOOK_ONCALL: "https://oapi.dingtalk.com/robot/send?access_token=替换成钉钉机器人的token"
  DINGTALK_SECRET_ONCALL: "SEC替换成加签密钥"
