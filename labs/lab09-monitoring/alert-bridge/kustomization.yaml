# Lab 09：部署 alert-bridge。用法（k8s-master）：kubectl apply -k alert-bridge/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
configMapGenerator:
  # 带哈希后缀：改了 bridge.py 再 apply，ConfigMap 名字变化会自动触发 Deployment 滚动更新
  - name: alert-bridge-script
    files:
      - bridge.py
