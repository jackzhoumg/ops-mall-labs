# Lab 09：用 Gateway API 暴露 grafana.lab.local / prometheus.lab.local
# 前提：Lab 06 建好了 Envoy Gateway 和共享 Gateway。
# 下面假设 Gateway 名叫 lab-gateway、在 envoy-gateway-system 命名空间，
# 且 HTTP 监听器（80 端口）允许所有命名空间挂路由（allowedRoutes.namespaces.from: All）。
# 名字不一样就改 parentRefs。查看：kubectl get gateway -A
#
# 学员电脑和虚拟机的 hosts 里加：192.168.56.200  grafana.lab.local prometheus.lab.local
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
  hostnames:
    - grafana.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # kube-prometheus-stack 里 Grafana 的 Service 名 = <release 名>-grafana，端口 80
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
  hostnames:
    - prometheus.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
# 注意：Prometheus 自带页面没有登录认证，任何能访问到域名的人都能查全部指标。
# 实验网段可以这样用；生产环境要在网关上加认证（Envoy Gateway SecurityPolicy 的 basicAuth / OIDC），
# 或者干脆不对外暴露，只让 Grafana 访问。
