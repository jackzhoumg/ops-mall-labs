# Lab 06 故障练习：Pending（一）
# 用法：kubectl apply -f faults/01-pending-resources.yaml   排查完：kubectl delete -f faults/01-pending-resources.yaml
# 故障 Pod 用单独的名字和标签（fault-*），不会混进 mall-api / mall-web 的 Service 后端
# 先别看注释里的提示，用 get / describe / logs / events 自己找原因
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-pending-cpu
  namespace: mall
  labels:
    app.kubernetes.io/name: fault-pending-cpu
    app.kubernetes.io/part-of: ops-mall-faults
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fault-pending-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fault-pending-cpu
        app.kubernetes.io/part-of: ops-mall-faults
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: mall-api
          image: harbor.lab.local/mall/mall-api:v1.0.0
          envFrom:
            - configMapRef:
                name: mall-api-config
            - secretRef:
                name: mall-api-secret
          resources:
            # 提示：实验节点是 2C4G
            requests:
              cpu: "8"
              memory: 64Mi
            limits:
              cpu: "8"
              memory: 256Mi
