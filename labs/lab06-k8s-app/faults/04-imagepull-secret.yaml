# Lab 06 故障练习：ImagePullBackOff（二）
# 用法：kubectl apply -f faults/04-imagepull-secret.yaml   排查完：kubectl delete -f faults/04-imagepull-secret.yaml
# 故障 Pod 用单独的名字和标签（fault-*），不会混进 mall-api / mall-web 的 Service 后端
# 先别看注释里的提示，用 get / describe / logs / events 自己找原因
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-image-secret
  namespace: mall
  labels:
    app.kubernetes.io/name: fault-image-secret
    app.kubernetes.io/part-of: ops-mall-faults
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fault-image-secret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fault-image-secret
        app.kubernetes.io/part-of: ops-mall-faults
    spec:
      containers:
        - name: mall-api
          image: harbor.lab.local/mall/mall-api:v1.0.0
          # Always：即使节点上缓存了这个镜像，也要去 Harbor 鉴权，故障才能稳定复现
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mall-api-config
            - secretRef:
                name: mall-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
