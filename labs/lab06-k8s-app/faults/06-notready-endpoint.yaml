# Lab 06 故障练习：Running 但 not Ready
# 用法：kubectl apply -f faults/06-notready-endpoint.yaml   排查完：kubectl delete -f faults/06-notready-endpoint.yaml
# 模拟“有人新建了一个数据库 Service，但 EndpointSlice 写错了”
apiVersion: v1
kind: Service
metadata:
  name: mysql-fault
  namespace: mall
  labels:
    app.kubernetes.io/part-of: ops-mall-faults
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mysql-fault-external
  namespace: mall
  labels:
    kubernetes.io/service-name: mysql-fault
    endpointslice.kubernetes.io/managed-by: cluster-admins
    app.kubernetes.io/part-of: ops-mall-faults
addressType: IPv4
ports:
  - name: mysql
    port: 3307
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.56.13
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-notready
  namespace: mall
  labels:
    app.kubernetes.io/name: fault-notready
    app.kubernetes.io/part-of: ops-mall-faults
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fault-notready
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fault-notready
        app.kubernetes.io/part-of: ops-mall-faults
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: mall-api
          image: harbor.lab.local/mall/mall-api:v1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mall-api-config
            - secretRef:
                name: mall-api-secret
          env:
            - name: MALL_DB_DSN
              value: "mall:MallPass123@tcp(mysql-fault.mall.svc:3306)/mall?parseTime=true&timeout=3s"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
