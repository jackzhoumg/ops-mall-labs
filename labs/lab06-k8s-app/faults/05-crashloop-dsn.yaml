# Lab 06 故障练习：CrashLoopBackOff
# 用法：kubectl apply -f faults/05-crashloop-dsn.yaml   排查完：kubectl delete -f faults/05-crashloop-dsn.yaml
# 故障 Pod 用单独的名字和标签（fault-*），不会混进 mall-api / mall-web 的 Service 后端
# 先别看注释里的提示，用 get / describe / logs / events 自己找原因
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-crashloop
  namespace: mall
  labels:
    app.kubernetes.io/name: fault-crashloop
    app.kubernetes.io/part-of: ops-mall-faults
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fault-crashloop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fault-crashloop
        app.kubernetes.io/part-of: ops-mall-faults
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: mall-api
          image: harbor.lab.local/mall/mall-api:v1.0.0
          envFrom:
            - configMapRef:
                name: mall-api-config
            - secretRef:
                name: mall-api-secret
          env:
            # env 里的同名变量优先级高于 envFrom，模拟“有人改坏了连接串”
            # 真实环境里连接串在 Secret 里，这里为了一个文件就能复现才直接写
            - name: MALL_DB_DSN
              value: "mall:MallPass123@tcp(mysql.mall.svc:3306)mall?parseTime=true&timeout=3s"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
