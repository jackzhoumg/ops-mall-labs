# 敏感配置：键名固定为 MALL_DB_DSN、MALL_REDIS_PASSWORD（Lab 08 Chart 引用同名 Secret）
# 这里为了实验方便用 stringData 明文写进仓库，密码是 Lab 02 的实验密码。
# 真实环境不要把明文 Secret 提交到 Git：用 Sealed Secrets / External Secrets（Lab 08 讲），
# 或者删掉这个文件，改用 kubectl create secret generic 手工创建。
apiVersion: v1
kind: Secret
metadata:
  name: mall-api-secret
  namespace: mall
  labels:
    app.kubernetes.io/name: mall-api
    app.kubernetes.io/part-of: ops-mall
type: Opaque
stringData:
  MALL_DB_DSN: "mall:MallPass123@tcp(mysql.mall.svc:3306)/mall?parseTime=true&timeout=3s"
  MALL_REDIS_PASSWORD: "ChangeMe-Redis-123"
