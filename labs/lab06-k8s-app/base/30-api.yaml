apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-api
  namespace: mall
  labels:
    app.kubernetes.io/name: mall-api
    app.kubernetes.io/part-of: ops-mall
spec:
  replicas: 2
  # 保留 5 个历史版本，rollout undo 用得到
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mall-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 先起新的、就绪了再停旧的：更新过程中可用副本数不低于 2
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mall-api
        app.kubernetes.io/part-of: ops-mall
    spec:
      # Harbor 的 mall 项目是私有的，没有它会 ImagePullBackOff
      imagePullSecrets:
        - name: harbor-pull
      # 删除 Pod 时：先执行 preStop（5s），再发 SIGTERM，应用最多优雅退出 10s（MALL_SHUTDOWN_GRACE），
      # 30s 内还没退出才 SIGKILL
      terminationGracePeriodSeconds: 30
      securityContext:
        # 镜像里是数字用户 USER 10001（alpine 版）/ 65532（distroless 版），这里只要求非 root
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # 两个副本尽量分到两台节点，一台节点挂了服务不中断
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mall-api
      containers:
        - name: mall-api
          image: harbor.lab.local/mall/mall-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mall-api-config
            - secretRef:
                name: mall-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # 就绪探针查依赖：数据库连不上就从 Service 后端摘掉，但不重启
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            # /readyz 内部 Ping 数据库超时 2s，探针超时要比它长
            timeoutSeconds: 3
            failureThreshold: 3
          # 存活探针只看进程：数据库挂了不该把应用重启一遍又一遍
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # 先等 5 秒让 kube-proxy / Envoy 把这个 Pod 摘掉，再收 SIGTERM，避免滚动更新时出现 502
            # sleep 动作不依赖镜像里有 sleep 命令（distroless 也能用），K8s v1.34 起 GA
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mall-api
  namespace: mall
  labels:
    app.kubernetes.io/name: mall-api
    app.kubernetes.io/part-of: ops-mall
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mall-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
