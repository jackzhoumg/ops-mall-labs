# MySQL 和 Redis 仍然跑在 lab-db1（192.168.56.13），不上 K8s。
# 无选择器 Service + 手工 EndpointSlice：应用用 mysql.mall.svc:3306 访问，
# 以后数据库换 IP 或者迁到云数据库，只改这里，不改应用配置。
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mall
  labels:
    app.kubernetes.io/part-of: ops-mall
spec:
  # 没有 selector：K8s 不会自动维护后端，后端由下面的 EndpointSlice 提供
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mysql-external
  namespace: mall
  labels:
    # 靠这个标签和 Service 关联，值必须是 Service 名
    kubernetes.io/service-name: mysql
    # 写一个非 controller 的值，表示这是手工管理的，EndpointSlice 控制器不会动它
    endpointslice.kubernetes.io/managed-by: cluster-admins
    app.kubernetes.io/part-of: ops-mall
addressType: IPv4
ports:
  # name 必须和 Service 的端口名一致
  - name: mysql
    port: 3306
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.56.13
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mall
  labels:
    app.kubernetes.io/part-of: ops-mall
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: redis-external
  namespace: mall
  labels:
    kubernetes.io/service-name: redis
    endpointslice.kubernetes.io/managed-by: cluster-admins
    app.kubernetes.io/part-of: ops-mall
addressType: IPv4
ports:
  - name: redis
    port: 6379
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.56.13
