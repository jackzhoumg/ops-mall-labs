# 网关共用的通配证书，所有 *.lab.local 站点（mall、grafana、argocd ...）都用它
# 有效期 90 天，到期前 30 天 cert-manager 自动续签，Envoy Gateway 自动加载新证书
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: envoy-gateway-system
spec:
  secretName: lab-wildcard-tls
  duration: 2160h     # 90 天
  renewBefore: 720h   # 提前 30 天续签
  commonName: "*.lab.local"
  dnsNames:
    - "*.lab.local"
    - lab.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
