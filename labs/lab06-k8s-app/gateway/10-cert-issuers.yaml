# 实验用自签 CA：lab.local 不是公网域名，申请不了 Let's Encrypt 证书。
# 链条：自签发行者 lab-selfsigned → 根 CA 证书 lab-root-ca → CA 发行者 lab-ca-issuer → 各种业务证书
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root-ca
  # ClusterIssuer 引用的 Secret 必须在 cert-manager 的“集群资源命名空间”，默认就是 cert-manager
  namespace: cert-manager
spec:
  isCA: true
  commonName: ops-mall Lab Root CA
  secretName: lab-root-ca
  duration: 87600h    # 10 年
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: lab-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca-issuer
spec:
  ca:
    secretName: lab-root-ca
