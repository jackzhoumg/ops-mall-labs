# MetalLB L2 模式：给 LoadBalancer 类型的 Service 分配 192.168.56.200-220，
# 由某一台节点用 ARP 应答这个 IP。前提：已安装 MetalLB（见 README）。
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    # 必须和节点同一个二层网段，且不能和 DHCP、其他虚拟机的 IP 冲突
    - 192.168.56.200-192.168.56.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
