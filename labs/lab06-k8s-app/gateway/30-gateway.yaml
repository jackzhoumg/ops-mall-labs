# 全课程共用的一个网关。Lab 08/09/10、SRE、AIOps 的 HTTPRoute 都挂在它上面，名字不要改。
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # 允许任何命名空间的 HTTPRoute 挂上来（实验方便；生产常用 Selector 按标签限制）
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
