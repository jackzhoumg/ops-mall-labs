# mall.lab.local 的路由，建在应用自己的命名空间 mall
# 1) https 监听器：/api 到 mall-api，其余到 mall-web
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mall
  namespace: mall
  labels:
    app.kubernetes.io/part-of: ops-mall
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - mall.lab.local
  rules:
    # 路径前缀按“路径段”匹配：/api 能匹配 /api、/api/products，不匹配 /apix
    # 只暴露 /api，/metrics /healthz 不对外
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: mall-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mall-web
          port: 80
---
# 2) http 监听器：全部 301 跳转到 https
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mall-http-redirect
  namespace: mall
  labels:
    app.kubernetes.io/part-of: ops-mall
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - mall.lab.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
