# mall-api 需要的 Secret 长这样（Chart 通过 api.existingSecret 引用，不负责创建）。
# 这是“明文”格式的示例，值都是占位符：真实密码永远不要提交到 Git。
#
# 两种用法：
# 1. Helm 练习阶段，直接在集群里创建（不进 Git）：
#    kubectl -n mall-staging create secret generic mall-api-secret \
#      --from-literal=MALL_DB_DSN='mall:<密码>@tcp(mysql:3306)/mall?parseTime=true&timeout=3s' \
#      --from-literal=MALL_REDIS_PASSWORD='<Redis 密码>'
# 2. GitOps 阶段，用 seal-mall-secret.sh 生成密文，写进 values-<env>.yaml，由 SealedSecret 还原
apiVersion: v1
kind: Secret
metadata:
  name: mall-api-secret
  namespace: mall-staging
type: Opaque
stringData:
  MALL_DB_DSN: "mall:CHANGE_ME@tcp(mysql:3306)/mall?parseTime=true&timeout=3s"
  MALL_REDIS_PASSWORD: ""
