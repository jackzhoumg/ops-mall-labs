# 进阶（可选）：Argo Rollouts Gateway API 流量插件
# 装了它，金丝雀按 HTTPRoute 权重精确切流量（20% 就是 20% 的请求），不再依赖副本数比例
# 写作时版本：插件 v0.18.0，以 GitHub Releases 最新版本为准
#
# kubectl apply -f labs/lab08-gitops/rollouts/gatewayapi-plugin.yaml
# kubectl -n argo-rollouts rollout restart deployment argo-rollouts
#
# 控制器启动时会从 GitHub 下载插件。国内网络下不通的话，把文件下载后放到内网 HTTP 服务器（如 Harbor 同机的 Nginx），
# 改 location 为内网地址。ARM 节点把 linux-amd64 换成 linux-arm64。
apiVersion: v1
kind: ConfigMap
metadata:
  # 名字和命名空间都是固定的
  name: argo-rollouts-config
  namespace: argo-rollouts
data:
  trafficRouterPlugins: |-
    - name: "argoproj-labs/gatewayAPI"
      location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.18.0/gatewayapi-plugin-linux-amd64"
---
# 插件需要读 Service、改 HTTPRoute
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-gateway-api-plugin
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "grpcroutes"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-gateway-api-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-gateway-api-plugin
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts
