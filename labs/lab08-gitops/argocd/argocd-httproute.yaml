# 通过 Lab 06 的网关暴露 ArgoCD 界面：http://argocd.lab.local
# 前提：argocd-server 已设置 server.insecure=true；Gateway 的监听器允许 argocd 命名空间的路由挂载
# kubectl apply -f labs/lab08-gitops/argocd/argocd-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
  hostnames:
    - argocd.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
