{{- $api := .Values.api -}}
{{- if and $api.sealedSecret.enabled $api.sealedSecret.encryptedData }}
# 密文只能被本集群 sealed-secrets 控制器解开，并且绑定了名字和命名空间（strict 模式），
# 所以每个环境要单独加密一次
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $api.existingSecret }}
  labels:
    {{- include "ops-mall.labels" (dict "root" . "name" $api.name) | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml $api.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ $api.existingSecret }}
      labels:
        {{- include "ops-mall.labels" (dict "root" . "name" $api.name) | nindent 8 }}
    type: Opaque
{{- end }}
