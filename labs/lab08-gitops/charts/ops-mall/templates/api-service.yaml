{{- $api := .Values.api -}}
{{- $ctx := dict "root" . "name" $api.name -}}
{{- $names := list $api.name -}}
{{- if $api.rollout.enabled -}}
{{- $names = list $api.name (printf "%s-stable" $api.name) (printf "%s-canary" $api.name) -}}
{{- end -}}
{{- range $i, $svc := $names }}
{{- if $i }}
---
{{- end }}
# {{ $svc }}：mall-web 和集群内调用方走 {{ $api.name }}；-stable / -canary 只在金丝雀发布时使用
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "ops-mall.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ops-mall.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $api.containerPort }}
      targetPort: http
      protocol: TCP
{{- end }}
