# 课后作业：打完 OTel 补丁、构建新镜像后，给 mall-api 加上这几个环境变量。
# 用法（k8s-master）：
#   kubectl -n mall patch deployment mall-api --type strategic --patch-file homework/deployment-otel-env.yaml
#   kubectl -n mall set image deployment/mall-api mall-api=harbor.lab.local/mall/mall-api:v1.1.0-otel
# 容器名不是 mall-api 的话，把下面 name 改成 kubectl -n mall get deploy mall-api -o jsonpath='{.spec.template.spec.containers[*].name}' 的输出。
spec:
  template:
    spec:
      containers:
        - name: mall-api
          env:
            # 发到集群里的 OpenTelemetry Collector（gRPC 4317）
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "mall-api"
            # 跟随网关的采样决定：网关采了，mall-api 也采；网关没采，mall-api 也不采
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            # 把 Pod 名、命名空间带进 span，Jaeger 里能看出是哪个 Pod 处理的
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),deployment.environment=lab"
