# mall-api 的 SLI / SLO 记录规则和多窗口多燃烧率告警（手写版）。
# 这是标准 Prometheus 规则文件格式，可以直接 promtool check / promtool test。
# 部署到 kube-prometheus-stack 时，用 scripts/make-prometheusrule.sh 包成 PrometheusRule。
#
# 两个 SLO（统计窗口 30 天）：
#   availability：/api/ 下的请求，非 5xx 的比例 >= 99.9%
#   latency     ：/api/ 下的请求，500ms 内完成的比例 >= 99%
#
# 指标来自 app/metrics.go：
#   mall_http_requests_total{method,route,status}
#   mall_http_request_duration_seconds_bucket{method,route,le}
# route 是路由模板，形如 "GET /api/products/{id}"，所以用 route=~".* /api/.*" 只统计业务接口，
# 排除 /healthz /readyz /metrics 和 unmatched（404 扫描请求）。
# job="mall-api" 来自 Lab 09 的 ServiceMonitor。它同时抓 mall、mall-staging、mall-prod 三个命名空间，
# 所以加上 namespace="mall"，只算 Lab 06 部署的这套；要给 mall-prod 做 SLO，复制一份改 namespace 和 service 标签。
#
# 告警参数来自 Google SRE Workbook《Alerting on SLOs》表 5-8：
#   page  ：1h/5m 窗口燃烧率 > 14.4（1 小时烧掉 2% 预算），或 6h/30m 窗口 > 6（6 小时烧掉 5%）
#   ticket：1d/2h 窗口 > 3（1 天烧掉 10%），或 3d/6h 窗口 > 1（3 天烧掉 10%）
groups:
  # ---------- 1. SLI：各个窗口的“坏事件比例” ----------
  - name: mall-api-slo-sli-availability
    interval: 30s
    rules:
      # 5 分钟的坏事件数和总数，单独记下来，30 天的比例用它们累加，避免直接算 rate(...[30d]) 太重
      - record: slo:sli_errors:rate5m
        expr: |
          sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[5m]))
          or vector(0)
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_requests:rate5m
        expr: sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[5m]))
        labels: {service: mall-api, slo: availability}
      # 错误比例 = 5xx 请求 / 全部请求。分子写 or vector(0)：从没出过 5xx 时分子没有时间序列，
      # 不加的话整个表达式没数据，大盘显示 No data、告警也永远不会算
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[5m])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[5m]))
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_error:ratio_rate30m
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[30m])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[30m]))
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_error:ratio_rate1h
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[1h])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[1h]))
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_error:ratio_rate2h
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[2h])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[2h]))
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_error:ratio_rate6h
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[6h])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[6h]))
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_error:ratio_rate1d
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[1d])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[1d]))
        labels: {service: mall-api, slo: availability}
      - record: slo:sli_error:ratio_rate3d
        expr: |
          (sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*",status=~"5.."}[3d])) or vector(0))
          / sum(rate(mall_http_requests_total{job="mall-api",namespace="mall",route=~".* /api/.*"}[3d]))
        labels: {service: mall-api, slo: availability}

  - name: mall-api-slo-sli-latency
    interval: 30s
    rules:
      # 慢请求 = 总数 - 500ms 内完成的数量（le="0.5" 的桶）。直方图桶见 app/metrics.go，0.5 正好是一个桶边界
      - record: slo:sli_errors:rate5m
        expr: |
          sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[5m]))
          - sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[5m]))
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_requests:rate5m
        expr: sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[5m]))
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate5m
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[5m]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[5m]))
          )
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate30m
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[30m]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[30m]))
          )
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate1h
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[1h]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[1h]))
          )
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate2h
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[2h]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[2h]))
          )
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate6h
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[6h]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[6h]))
          )
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate1d
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[1d]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[1d]))
          )
        labels: {service: mall-api, slo: latency}
      - record: slo:sli_error:ratio_rate3d
        expr: |
          1 - (
            sum(rate(mall_http_request_duration_seconds_bucket{job="mall-api",namespace="mall",route=~".* /api/.*",le="0.5"}[3d]))
            / sum(rate(mall_http_request_duration_seconds_count{job="mall-api",namespace="mall",route=~".* /api/.*"}[3d]))
          )
        labels: {service: mall-api, slo: latency}

  # ---------- 2. SLO 目标、错误预算、30 天窗口 ----------
  - name: mall-api-slo-budget
    interval: 1m
    rules:
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels: {service: mall-api, slo: availability}
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels: {service: mall-api, slo: latency}
      # 错误预算 = 1 - 目标。99.9% 的预算是 0.1%
      - record: slo:error_budget:ratio
        expr: 1 - slo:objective:ratio
      # 30 天错误比例：把 5 分钟的坏事件速率和总速率各自累加再相除（按请求量加权，比平均比例准）
      - record: slo:sli_error:ratio_rate30d
        expr: |
          sum_over_time(slo:sli_errors:rate5m[30d])
          / sum_over_time(slo:sli_requests:rate5m[30d])
      # 剩余错误预算：1 = 一点没用，0 = 用完，负数 = 已经透支（违反 SLO）
      - record: slo:error_budget_remaining:ratio
        expr: |
          1 - (slo:sli_error:ratio_rate30d / on(service, slo) slo:error_budget:ratio)
      # 当前燃烧率，给大盘用。1 = 正好在 30 天末用完预算
      - record: slo:burn_rate:1h
        expr: slo:sli_error:ratio_rate1h / on(service, slo) slo:error_budget:ratio
      - record: slo:burn_rate:6h
        expr: slo:sli_error:ratio_rate6h / on(service, slo) slo:error_budget:ratio
      - record: slo:burn_rate:3d
        expr: slo:sli_error:ratio_rate3d / on(service, slo) slo:error_budget:ratio

  # ---------- 3. 多窗口多燃烧率告警 ----------
  - name: mall-api-slo-alerts
    rules:
      # 快烧：长窗口确认“烧得多”，短窗口确认“现在还在烧”，故障恢复后 5 分钟左右告警就能消失
      - alert: SLOErrorBudgetBurnFast
        expr: |
          (
            slo:sli_error:ratio_rate1h > on(service, slo) (14.4 * slo:error_budget:ratio)
            and
            slo:sli_error:ratio_rate5m > on(service, slo) (14.4 * slo:error_budget:ratio)
          )
          or
          (
            slo:sli_error:ratio_rate6h > on(service, slo) (6 * slo:error_budget:ratio)
            and
            slo:sli_error:ratio_rate30m > on(service, slo) (6 * slo:error_budget:ratio)
          )
        for: 2m
        labels:
          severity: critical
          notify: page
        annotations:
          summary: "{{ $labels.service }} 的 {{ $labels.slo }} 错误预算正在快速消耗"
          description: "按当前速度，几小时到一两天内就会烧光 30 天的错误预算。当前错误比例 {{ $value | humanizePercentage }}。先止血：回滚最近的发布或切流量。"
          runbook_url: "https://github.com/jackzhoumg/ops-mall-labs/blob/main/labs/sre-1-tracing-slo/slo/error-budget-policy.md"
      # 慢烧：不用半夜叫人，开工单，第二天工作时间处理
      - alert: SLOErrorBudgetBurnSlow
        expr: |
          (
            slo:sli_error:ratio_rate1d > on(service, slo) (3 * slo:error_budget:ratio)
            and
            slo:sli_error:ratio_rate2h > on(service, slo) (3 * slo:error_budget:ratio)
          )
          or
          (
            slo:sli_error:ratio_rate3d > on(service, slo) (1 * slo:error_budget:ratio)
            and
            slo:sli_error:ratio_rate6h > on(service, slo) (1 * slo:error_budget:ratio)
          )
        for: 15m
        labels:
          severity: warning
          notify: ticket
        annotations:
          summary: "{{ $labels.service }} 的 {{ $labels.slo }} 错误预算消耗偏快"
          description: "持续的小幅错误正在消耗预算，照这个速度本周期结束前会用完。当前错误比例 {{ $value | humanizePercentage }}。"
          runbook_url: "https://github.com/jackzhoumg/ops-mall-labs/blob/main/labs/sre-1-tracing-slo/slo/error-budget-policy.md"
      # 预算用完：触发错误预算政策（冻结发布）
      - alert: SLOErrorBudgetExhausted
        expr: slo:error_budget_remaining:ratio <= 0
        for: 10m
        labels:
          severity: warning
          notify: ticket
        annotations:
          summary: "{{ $labels.service }} 的 {{ $labels.slo }} 30 天错误预算已用完"
          description: "剩余预算 {{ $value | humanizePercentage }}。按错误预算政策：冻结功能发布，只允许修复稳定性的变更。"
          runbook_url: "https://github.com/jackzhoumg/ops-mall-labs/blob/main/labs/sre-1-tracing-slo/slo/error-budget-policy.md"
