# Jaeger v2 all-in-one：收链路 + 查询界面，数据存内存（重启即丢，只用于实验）。
# 写作时版本：Jaeger v2.23.0，以 https://www.jaegertracing.io/docs/latest/ 为准。
# 生产环境要换成 Elasticsearch / OpenSearch / Cassandra 等持久存储，并把 collector 和 query 拆开部署。
#
# 用法（k8s-master）：kubectl apply -f tracing/jaeger.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: ops-mall
spec:
  replicas: 1 # 内存存储不能多副本，否则每个副本只看到一部分链路
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: ops-mall
    spec:
      containers:
        - name: jaeger
          # 国内拉不下来时：先在能访问外网的机器拉取，推到 harbor.lab.local/mirror/ 再改这里
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi # 内存存储会一直涨，给个上限，超了会被 OOMKill 重启（链路清空）
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: ops-mall
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
