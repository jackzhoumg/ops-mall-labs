# Lab 10：lab-db1 的 Fluent Bit 配置（/etc/fluent-bit/fluent-bit.conf）
# 采集：MySQL 慢查询日志（多行合并成一条）、MySQL 错误日志
# 输出：K8s 里的 Loki（经网关 loki.lab.local），租户 mall
# __HOSTNAME__ 由 install-fluent-bit-vm.sh 替换成本机主机名

[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /etc/fluent-bit/parsers.conf
    Parsers_File              /etc/fluent-bit/parsers-vm.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /var/lib/fluent-bit/storage/
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name              tail
    Tag               mysql.slow
    Path              /var/log/mysql/mysql-slow.log
    multiline.parser  mysql_slow
    DB                /var/lib/fluent-bit/tail-mysql-slow.db
    Mem_Buf_Limit     10MB
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               mysql.error
    Path              /var/log/mysql/error.log
    DB                /var/lib/fluent-bit/tail-mysql-error.db
    Mem_Buf_Limit     5MB
    storage.type      filesystem

[OUTPUT]
    Name              loki
    Match             mysql.slow
    Host              loki.lab.local
    Port              80
    Tenant_ID         mall
    Labels            job=mysql-slow, host=__HOSTNAME__, env=vm
    Drop_Single_Key   raw
    Retry_Limit       no_limits

[OUTPUT]
    Name              loki
    Match             mysql.error
    Host              loki.lab.local
    Port              80
    Tenant_ID         mall
    Labels            job=mysql-error, host=__HOSTNAME__, env=vm
    Drop_Single_Key   raw
    Retry_Limit       no_limits
