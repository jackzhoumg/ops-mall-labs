# Lab 10：虚拟机上 Fluent Bit 用到的解析器，放到 /etc/fluent-bit/parsers-vm.conf

# Nginx 的 mall_json 格式和 mall-api 的 slog 输出都是一行一个 JSON。
# 不设 Time_Key：用 Fluent Bit 读到这行的时间做时间戳（和写入时间只差几毫秒），
# 原始的 time 字段保留在日志正文里。
[PARSER]
    Name   mall_json
    Format json

# MySQL 慢日志一条记录占多行，以 "# Time:" 开头：
#   # Time: 2026-11-24T09:00:01.123456Z
#   # User@Host: mall[mall] @  [192.168.56.11]  Id:    12
#   # Query_time: 2.000213  Lock_time: 0.000002 Rows_sent: 1  Rows_examined: 1
#   SET timestamp=1795512001;
#   SELECT SLEEP(2);
# 规则：遇到 "# Time:" 开始一条新记录，之后不以 "# Time:" 开头的行都拼到这条记录里。
[MULTILINE_PARSER]
    Name          mysql_slow
    Type          regex
    Flush_Timeout 2000
    Rule          "start_state"   "/^# Time: /"          "cont"
    Rule          "cont"          "/^(?!# Time: ).*/"    "cont"
