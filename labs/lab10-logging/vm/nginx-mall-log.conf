# Lab 10：Nginx JSON 访问日志格式（lab-web1 / lab-web2）
# 放到 /etc/nginx/conf.d/00-mall-log-format.conf。Ubuntu 的 /etc/nginx/nginx.conf 在 http 块里 include conf.d/*.conf，
# 所以 map 和 log_format 写在这里就是 http 级别的配置。文件名以 00- 开头，保证比 Lab 02 的站点配置先加载。
#
# 然后在 Lab 02 的 mall 站点 server 块里加两行（见教程 5.5.2）：
#   access_log /var/log/nginx/mall_access_json.log mall_json;
#   location /api/ { ... proxy_set_header X-Request-ID $mall_request_id; ... }
#
# 文件名用 .log 结尾，系统自带的 /etc/logrotate.d/nginx（匹配 /var/log/nginx/*log）才会帮它轮转。

# 请求头里带了 X-Request-ID 就沿用，没带就用 Nginx 生成的 32 位随机 ID。
# 再通过 proxy_set_header 传给 mall-api，Nginx 日志和 mall-api 日志里的 request_id 就是同一个值。
map $http_x_request_id $mall_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# escape=json：变量里有引号、反斜杠时自动转义，保证每行都是合法 JSON
log_format mall_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$mall_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';
