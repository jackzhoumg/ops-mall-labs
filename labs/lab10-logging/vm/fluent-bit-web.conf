# Lab 10：lab-web1 / lab-web2 的 Fluent Bit 配置（/etc/fluent-bit/fluent-bit.conf）
# 采集：Nginx JSON 访问日志、Nginx 错误日志、systemd 里 mall-api 服务的 JSON 日志
# 输出：K8s 里的 Loki（经网关 loki.lab.local），租户 mall
# __HOSTNAME__ 由 install-fluent-bit-vm.sh 替换成本机主机名

[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /etc/fluent-bit/parsers.conf
    Parsers_File              /etc/fluent-bit/parsers-vm.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    Health_Check              On
    # 文件缓冲：Loki 或网络不可用时，数据先落到本地磁盘，恢复后补发，不丢日志
    storage.path              /var/lib/fluent-bit/storage/
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/nginx/mall_access_json.log
    Parser            mall_json
    DB                /var/lib/fluent-bit/tail-nginx.db
    Mem_Buf_Limit     10MB
    storage.type      filesystem
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Tag               nginx.error
    Path              /var/log/nginx/error.log
    DB                /var/lib/fluent-bit/tail-nginx-error.db
    Mem_Buf_Limit     5MB
    storage.type      filesystem

# Lab 02 里 mall-api 是 systemd 服务，标准输出进了 journald
[INPUT]
    Name              systemd
    Tag               mallapi.journal
    Systemd_Filter    _SYSTEMD_UNIT=mall-api.service
    DB                /var/lib/fluent-bit/journal-mall-api.db
    Read_From_Tail    On
    storage.type      filesystem

# journald 记录里业务日志在 MESSAGE 字段，是一个 JSON 字符串，解析成字段；
# Reserve_Data Off：解析后只保留 JSON 里的字段，丢掉 _PID、_BOOT_ID 这些 journald 元数据
[FILTER]
    Name              parser
    Match             mallapi.*
    Key_Name          MESSAGE
    Parser            mall_json
    Reserve_Data      Off

[OUTPUT]
    Name              loki
    Match             nginx.access
    Host              loki.lab.local
    Port              80
    Tenant_ID         mall
    Labels            job=nginx, log_type=access, host=__HOSTNAME__, env=vm
    Line_Format       json
    Retry_Limit       no_limits

[OUTPUT]
    Name              loki
    Match             nginx.error
    Host              loki.lab.local
    Port              80
    Tenant_ID         mall
    Labels            job=nginx, log_type=error, host=__HOSTNAME__, env=vm
    # 只有一个 log 字段时，直接发原文，不包成 {"log":"..."}
    Drop_Single_Key   raw
    Retry_Limit       no_limits

[OUTPUT]
    Name              loki
    Match             mallapi.*
    Host              loki.lab.local
    Port              80
    Tenant_ID         mall
    Labels            job=mall-api-vm, host=__HOSTNAME__, env=vm
    Line_Format       json
    Retry_Limit       no_limits
