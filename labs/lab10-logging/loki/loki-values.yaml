# Lab 10：Loki 单体模式（Monolithic）实验环境 values
# 写作时版本：grafana-community/loki chart 21.6.0（Loki 3.7.10）。以官方最新文档为准。
# 注意：2026 年 3 月起 Loki 的 Helm chart 改由社区仓库 grafana-community/helm-charts 维护，
#       版本号重新编排（和旧的 grafana/loki 6.x、7.x 不连续），单体模式的名字从 SingleBinary 改成 Monolithic。
#
# 用法（k8s-master）：
#   helm upgrade --install loki oci://ghcr.io/grafana-community/helm-charts/loki \
#     --version 21.6.0 -n logging --create-namespace -f loki/loki-values.yaml
#
# 设计思路：
#   - 单个 Pod 跑全部组件，文件系统存储（本地 PVC），内存控制在 1Gi 以内；
#   - 打开多租户（auth_enabled），按业务线分成 mall 和 platform 两个租户，数据互相隔离；
#   - 打开保留策略：默认 7 天，mall 租户 14 天；
#   - 打开 ruler，日志告警发给 Lab 09 的 Alertmanager。

deploymentMode: Monolithic

loki:
  # 多租户：每个请求必须带 X-Scope-OrgID 请求头，Loki 按租户分开存储、查询和限流
  auth_enabled: true

  commonConfig:
    # 只有 1 个副本，复制因子必须是 1，否则写入会失败
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          # 保留策略要求索引周期是 24h
          period: 24h

  storage:
    type: filesystem

  limits_config:
    # 默认所有租户保留 7 天（168h），被 runtimeConfig 里的按租户配置覆盖
    retention_period: 168h
    # 结构化元数据：Fluent Bit 把 pod 名放这里，不当标签，避免标签基数过高
    allow_structured_metadata: true
    volume_enabled: true
    # 实验环境的写入限速，防止某个 Pod 疯狂打日志把 Loki 打挂
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    max_query_lookback: 336h

  # 按租户覆盖默认配置，这个文件改了不用重启 Loki，大约 10 秒内生效
  runtimeConfig:
    overrides:
      mall:
        retention_period: 336h # 商城业务日志保留 14 天
      platform:
        retention_period: 72h # 平台组件日志保留 3 天

  compactor:
    # 保留策略由 compactor 执行：定期扫描索引，标记并删除过期的数据块
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h

  rulerConfig:
    enable_api: true
    # 告警发给 Lab 09 装的 Alertmanager
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
    # 规则从本地目录读，目录结构是 /rules/<租户名>/<文件>.yaml，由 rules sidecar 从 ConfigMap 写进来
    storage:
      type: local
      local:
        directory: /rules
    # 告警消息里"来源"链接指向 Grafana
    external_url: http://grafana.lab.local

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    # 留空用集群默认 StorageClass（Lab 09 装的 local-path）
    storageClass: null

# rules sidecar：把带 loki_rule 标签的 ConfigMap 写进 /rules，
# ConfigMap 上的 loki_rule_tenant 注解决定写进哪个租户的子目录
sidecar:
  rules:
    enabled: true
    label: loki_rule
    labelValue: "1"
    folder: /rules
    folderAnnotation: loki_rule_tenant
    searchNamespace: logging
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

# 网关（NGINX）：所有读写都从这里进，Fluent Bit 和 Grafana 都连 loki-gateway
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 96Mi

# 下面这些组件实验环境用不到，全部关掉或副本为 0
# chunks 缓存默认要 8GiB 内存，必须关掉
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
