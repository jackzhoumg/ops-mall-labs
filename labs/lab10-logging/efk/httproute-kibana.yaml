# Lab 10（选做）：用 Gateway API 暴露 kibana.lab.local
# ECK 创建的 Kibana Service 名是 <Kibana 名>-kb-http，端口 5601
# 学员电脑 hosts 里加：192.168.56.200  kibana.lab.local
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: logging
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
  hostnames:
    - kibana.lab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mall-kibana-kb-http
          port: 5601
