# /etc/redis/redis.conf 关键项（lab-db1）
# 不要整个文件替换：Redis 官方 APT 源（packages.redis.io）的 redis-server 包（写作时 8.12.0）已经带了一份
# 完整的默认配置（属主 redis:redis、权限 640），只改下面这几行，其余保持默认值。
# 和 Lab 03 roles/redis/defaults/main.yml 的 redis_settings 一一对应
#
# 改法：用 vim 搜到对应的行（很多是被 # 注释掉的）改掉；找不到的追加到文件末尾。
# 改完：sudo systemctl restart redis-server
# 只监听本机和内网地址，不要监听 0.0.0.0 暴露到公网（公网裸奔的 Redis 几分钟就会被扫到写入挖矿脚本）
bind 127.0.0.1 192.168.56.13
port 6379
protected-mode yes
# 密码和 Lab 03 vault.yml.example 的默认值一致；生产环境换成 32 位以上随机串
requirepass ChangeMe-Redis-123
# 内存上限：缓存场景满了就按 LRU 淘汰最久没用的 key，不至于把机器内存吃光被 OOM
maxmemory 256mb
maxmemory-policy allkeys-lru
# ---- 持久化 ----
# AOF：每条写命令追加到日志，默认 appendfsync everysec，宕机最多丢 1 秒数据。
# Redis 7 起 AOF 是多文件格式，放在 /var/lib/redis/appendonlydir/ 目录里（base + incr + manifest）
appendonly yes
# RDB：默认就开着，没写 save 时的默认规则是 3600 秒 1 次写、300 秒 100 次写、60 秒 10000 次写触发快照，
# 生成 /var/lib/redis/dump.rdb，用来做备份和快速重启
# 两个都开时，重启优先用 AOF 恢复（数据更全）
