# /etc/keepalived/keepalived.conf（lab-web2，备）
# 和主的区别：router_id、state BACKUP、priority 90、单播的源和对端互换
global_defs {
    router_id lab-web2
    script_user root
    enable_script_security
}

vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance VI_MALL {
    state BACKUP
    interface enp0s8
    virtual_router_id 51
    priority 90
    advert_int 1
    unicast_src_ip 192.168.56.12
    unicast_peer {
        192.168.56.11
    }
    authentication {
        auth_type PASS
        auth_pass mall2026
    }
    virtual_ipaddress {
        192.168.56.10/24 dev enp0s8
    }
    track_script {
        chk_nginx
    }
}
