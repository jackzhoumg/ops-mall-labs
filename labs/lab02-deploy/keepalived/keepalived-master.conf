# /etc/keepalived/keepalived.conf（lab-web1，主）
# 权限 600（里面有认证密码）。和 Lab 03 roles/keepalived/templates/keepalived.conf.j2 结构一致，
# 区别只有健康检查：这里调用 check_nginx.sh（多一次 HTTP 探测），Lab 03 模板简化成 systemctl is-active
# 网卡 enp0s8 是 VirtualBox 第二块网卡（Host-Only），用 ip -br addr 查看后按实际替换
global_defs {
    router_id lab-web1
    script_user root
    enable_script_security
}

# Nginx 不健康就把优先级降 20（100 - 20 = 80 < 备机 90），VIP 漂到另一台
vrrp_script chk_nginx {
    script "/usr/libexec/keepalived/check_nginx.sh"
    interval 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance VI_MALL {
    state MASTER
    interface enp0s8
    # 同一网段里每组主备的 virtual_router_id 必须唯一（0-255），和别的组撞了会互相抢 VIP
    virtual_router_id 51
    priority 100
    advert_int 1
    # 单播给对端：VMware、云服务器上组播经常不通，单播最省心
    unicast_src_ip 192.168.56.11
    unicast_peer {
        192.168.56.12
    }
    authentication {
        auth_type PASS
        # 最多 8 个字符，超出部分被截断
        auth_pass mall2026
    }
    virtual_ipaddress {
        192.168.56.10/24 dev enp0s8
    }
    track_script {
        chk_nginx
    }
}
