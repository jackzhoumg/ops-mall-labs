# Lab 03 主机清单：按 web / db 分组
# IP 按自己的虚拟机网段替换（VirtualBox Host-Only 默认 192.168.56.0/24）

[web]
lab-web1 ansible_host=192.168.56.11
lab-web2 ansible_host=192.168.56.12

[db_primary]
lab-db1 ansible_host=192.168.56.13

[db_replica]
lab-db2 ansible_host=192.168.56.14

# db 组 = 主库 + 从库，group_vars/db.yml 对两台都生效
[db:children]
db_primary
db_replica

# Redis 和主库放在同一台
[redis]
lab-db1

# 整个商城环境
[mall:children]
web
db
