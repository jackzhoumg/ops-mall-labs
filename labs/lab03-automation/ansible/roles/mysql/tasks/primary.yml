- name: 查询现有数据库
  ansible.mysql.mysql_info:
    filter: databases
    login_unix_socket: "{{ mysql_socket }}"
  register: mysql_dbs

# init.sql 本身可重复执行，但大表导入很慢，只在库不存在时导入一次
- name: 首次部署时导入 sql/init.sql
  when: mall_db_name not in mysql_dbs.databases
  block:
    - name: 拷贝初始化脚本
      ansible.builtin.copy:
        src: "{{ repo_root }}/sql/init.sql"
        dest: /root/mall-init.sql
        mode: "0600"

    - name: 导入初始化脚本
      ansible.mysql.mysql_db:
        name: all
        state: import
        target: /root/mall-init.sql
        login_unix_socket: "{{ mysql_socket }}"

# MySQL 8.4 默认不加载 mysql_native_password 插件，而 mysql_user 模块的 password 参数在 9.7 以前
# 走的是 mysql_native_password，会报 Plugin 'mysql_native_password' is not loaded。
# 所以显式用 caching_sha2_password + plugin_auth_string。这个插件每次生成哈希都用随机盐，
# 模块没法判断密码变没变，每次都会 ALTER USER（不幂等）；给一个固定的 20 位 salt，模块就能算出同样的哈希来比较
- name: 应用账号（密码以 vault 为准，覆盖 init.sql 里的默认密码）
  ansible.mysql.mysql_user:
    name: "{{ mall_db_user }}"
    host: "%"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mall_db_password }}"
    salt: "{{ (mall_db_user ~ mysql_salt_suffix) | hash('sha1') | truncate(20, true, '', 0) }}"
    priv: "{{ mall_db_name }}.*:SELECT,INSERT,UPDATE,DELETE"
    login_unix_socket: "{{ mysql_socket }}"
    state: present
  no_log: true

- name: 复制账号
  ansible.mysql.mysql_user:
    name: "{{ mysql_repl_user }}"
    host: "{{ mysql_repl_host }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_repl_password }}"
    salt: "{{ (mysql_repl_user ~ mysql_salt_suffix) | hash('sha1') | truncate(20, true, '', 0) }}"
    priv: "*.*:REPLICATION SLAVE"
    login_unix_socket: "{{ mysql_socket }}"
    state: present
  no_log: true

# 备份账号建在主库，会通过复制同步到从库
- name: 备份账号（mysqldump --single-transaction --source-data 需要的最小权限）
  ansible.mysql.mysql_user:
    name: "{{ mysql_backup_user }}"
    host: localhost
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_backup_password }}"
    salt: "{{ (mysql_backup_user ~ mysql_salt_suffix) | hash('sha1') | truncate(20, true, '', 0) }}"
    priv: "*.*:SELECT,SHOW VIEW,TRIGGER,LOCK TABLES,EVENT,RELOAD,REPLICATION CLIENT,PROCESS"
    login_unix_socket: "{{ mysql_socket }}"
    state: present
  no_log: true
