common_packages:
  - chrony
  - cron
  - ufw
  - vim
  - curl
  - tar
  - rsync
  - lsof
  - sysstat
  - openssl
  - bash-completion
  - ca-certificates
  # ansible.builtin.apt 模块要用；Ubuntu Server 默认已装，最小化镜像可能没有
  - python3-apt
  # ansible.builtin.deb822_repository 模块要用（mysql、nginx 角色添加官方 APT 源）
  - python3-debian
common_sysctl:
  net.core.somaxconn: 1024
  vm.swappiness: 10
