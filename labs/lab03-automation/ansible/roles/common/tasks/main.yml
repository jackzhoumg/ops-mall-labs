- name: 只支持 Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
    fail_msg: "本角色按 Ubuntu Server 24.04 LTS 编写，当前是 {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: 设置主机名
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: 写入实验环境 hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ops-mall lab hosts (managed by ansible)"
    block: |
      {% for h in lab_hosts %}
      {{ h.ip }} {{ h.names }}
      {% endfor %}

- name: 设置时区
  community.general.timezone:
    name: "{{ lab_timezone }}"

- name: 安装基础软件包
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    # 一小时内更新过软件源索引就不再 apt update，第二次执行更快，也不会显示 changed
    update_cache: true
    cache_valid_time: 3600

- name: 启动基础服务
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - chrony
    - cron

# ufw 默认策略是拒绝所有入站。先放行 SSH 再启用，顺序反了 Ansible 自己就断线了
- name: 防火墙放行 SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: 启用防火墙（默认拒绝入站）
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: 内核参数
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-ops-mall.conf
    state: present
  loop: "{{ common_sysctl | dict2items }}"

- name: 运维目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - /etc/ops
    - /var/log/ops

- name: 运维脚本日志轮转（不加的话 /var/log/ops 会一直涨）
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ops
    content: |
      /var/log/ops/*.log {
          weekly
          rotate 8
          compress
          missingok
          notifempty
      }
    owner: root
    group: root
    mode: "0644"

- name: 部署运维脚本
  ansible.builtin.copy:
    src: "{{ scripts_src }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - inspect.sh
    - nginx_log_stats.sh

- name: 巡检定时任务（每 10 分钟）
  ansible.builtin.cron:
    name: ops inspect
    cron_file: ops-inspect
    user: root
    minute: "*/10"
    job: >-
      SERVICES="{{ inspect_services }}" CERT_FILES="{{ inspect_cert_files }}"
      /usr/local/bin/inspect.sh >/dev/null 2>&1
