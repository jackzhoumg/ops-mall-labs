# 和 mysql、nginx 角色一样用 DEB822 格式加源，公钥只给这个源用
- name: 添加 Redis 官方 APT 源
  ansible.builtin.deb822_repository:
    name: redis
    types: deb
    uris: "{{ redis_apt_uri }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "{{ redis_apt_key_url }}"
    state: present
  register: redis_repo
- name: 安装 Redis
  ansible.builtin.apt:
    name:
      - redis-server
      - redis-tools
    state: present
    update_cache: "{{ redis_repo is changed }}"
- name: 读取 Redis 版本
  ansible.builtin.command:
    cmd: redis-server --version
  register: redis_version_out
  changed_when: false
- name: 确认装的是官方源的 {{ redis_major_version }}.x
  ansible.builtin.assert:
    that: redis_version_out.stdout is search('v=' ~ redis_major_version ~ '\.')
    fail_msg: "装上的是 {{ redis_version_out.stdout }}，不是 {{ redis_major_version }}.x。检查 /etc/apt/sources.list.d/redis.sources 和 apt policy redis-server"
    quiet: true

- name: 修改 Redis 配置
  ansible.builtin.lineinfile:
    path: "{{ redis_conf }}"
    # 匹配已有的配置行（包括被注释掉的），找不到就追加到文件末尾
    regexp: '^#?\s*{{ item.key }}\s'
    line: "{{ item.key }} {{ item.value }}"
    owner: redis
    group: redis
    mode: "0640"
  loop: "{{ redis_settings }}"
  loop_control:
    label: "{{ item.key }}"   # 循环输出里只显示配置名，不把密码打到屏幕上
  notify: restart redis
  diff: false

- name: Redis 建议的内核参数，避免后台持久化 fork 失败
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    sysctl_file: /etc/sysctl.d/90-redis.conf
    state: present
  when: redis_set_overcommit_memory | bool

- name: 防火墙只对实验网段开放 6379
  community.general.ufw:
    rule: allow
    src: "{{ lab_network }}"
    port: "{{ redis_port | string }}"
    proto: tcp
    comment: redis

- name: 启动 Redis
  ansible.builtin.systemd_service:
    name: "{{ redis_service }}"
    state: started
    enabled: true

- name: 配置变了现在就重启
  ansible.builtin.meta: flush_handlers

- name: 确认密码生效
  ansible.builtin.command:
    cmd: redis-cli -h 127.0.0.1 -p {{ redis_port }} ping
  environment:
    # 用环境变量传密码，不出现在命令行（ps 能看到命令行参数）
    REDISCLI_AUTH: "{{ redis_password }}"
  register: redis_ping
  changed_when: false
  failed_when: "'PONG' not in redis_ping.stdout"
