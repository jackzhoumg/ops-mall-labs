# kube-bench：在控制平面节点上跑 CIS Kubernetes Benchmark（master、etcd、controlplane、policies 四部分）。
# 改编自 kube-bench 官方 job-master.yaml（写作时 kube-bench v0.16.0）。
#
# 为什么写死 --benchmark cis-2.0：kube-bench v0.16.0（写作时最新）的版本映射表最高只到 Kubernetes 1.35，
# 课程集群是 1.37，自动识别会失败。等官方映射表加上 1.37 后，可以去掉这个参数。
#
# 用法（k8s-master 上执行）：
#   kubectl apply -f job-master.yaml
#   kubectl -n kube-bench wait --for=condition=complete job/kube-bench-master --timeout=180s
#   kubectl -n kube-bench logs job/kube-bench-master > kube-bench-master.txt
apiVersion: v1
kind: Namespace
metadata:
  name: kube-bench
  labels:
    # 要挂宿主机目录、用 hostPID，只能放在 privileged 命名空间
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-master
  namespace: kube-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      hostPID: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: kube-bench
          # 国内拉不到 Docker Hub 时，先同步到 harbor.lab.local/library/kube-bench:v0.16.0 再改这里
          image: docker.io/aquasec/kube-bench:v0.16.0
          command:
            - kube-bench
            - run
            - --targets
            - master,etcd,controlplane,policies
            - --benchmark
            - cis-2.0
          volumeMounts:
            - { name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true }
            - { name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true }
            - { name: etc-systemd, mountPath: /etc/systemd, readOnly: true }
            - { name: lib-systemd, mountPath: /lib/systemd/, readOnly: true }
            - { name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true }
            - { name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true }
            - { name: etc-cni-netd, mountPath: /etc/cni/net.d/, readOnly: true }
            - { name: opt-cni-bin, mountPath: /opt/cni/bin/, readOnly: true }
            - { name: etc-passwd, mountPath: /etc/passwd, readOnly: true }
            - { name: etc-group, mountPath: /etc/group, readOnly: true }
      volumes:
        - { name: var-lib-etcd, hostPath: { path: /var/lib/etcd } }
        - { name: var-lib-kubelet, hostPath: { path: /var/lib/kubelet } }
        - { name: etc-systemd, hostPath: { path: /etc/systemd } }
        - { name: lib-systemd, hostPath: { path: /lib/systemd } }
        - { name: etc-kubernetes, hostPath: { path: /etc/kubernetes } }
        - { name: usr-bin, hostPath: { path: /usr/bin } }
        - { name: etc-cni-netd, hostPath: { path: /etc/cni/net.d/ } }
        - { name: opt-cni-bin, hostPath: { path: /opt/cni/bin/ } }
        - { name: etc-passwd, hostPath: { path: /etc/passwd } }
        - { name: etc-group, hostPath: { path: /etc/group } }
