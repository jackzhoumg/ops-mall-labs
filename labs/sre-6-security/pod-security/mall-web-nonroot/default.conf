# mall-web 非 root 版 Nginx 配置：监听 8080，静态页面 + /api/ 反向代理到 mall-api。
# 和 Lab 04 的 mall-web 配置功能一致，只是端口从 80 改成 8080。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 Nginx 版本号
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lab 04 的模板用 resolver + 变量，是为了 Compose 里后端容器重建后 IP 会变。
    # K8s 里 Service 的 ClusterIP 不随 Pod 重建变化，直接写死域名即可；
    # 也不用 envsubst 模板，因为只读根文件系统下入口脚本没法往 /etc/nginx/conf.d 写渲染结果。
    location /api/ {
        proxy_pass http://mall-api.mall.svc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
