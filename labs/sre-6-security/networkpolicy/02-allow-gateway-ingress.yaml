# 第 2 条：只允许网关（Envoy Gateway 的代理 Pod，在 envoy-gateway-system 命名空间）访问 mall-web 和 mall-api。
# 如果你的 Envoy Gateway 装在别的命名空间，改 kubernetes.io/metadata.name 的值。
# 查代理 Pod 在哪：kubectl get pods -A -l gateway.envoyproxy.io/owning-gateway-name
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-web
  namespace: mall
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mall-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        # 8080：非 root 版 mall-web（5.4 节加固后）；80：加固前的版本。加固完成后可以删掉 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api
  namespace: mall
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mall-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
