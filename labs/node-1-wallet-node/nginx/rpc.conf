# Node-1：以太坊 JSON-RPC 对内反向代理（放在 /etc/nginx/conf.d/eth-rpc.conf）
#
# 设计：
#   1. 只监听内网地址，公网访问不到；再用 allow / deny 限定来源网段（钱包服务所在网段）
#   2. 每个调用方一个 API Key（请求头 X-Api-Key），出了问题能定位是谁在打，也能单独封禁
#   3. 按调用方限流，防止一个扫块程序写出死循环把节点打挂，影响提现广播
#   4. 只允许 POST、限制请求体大小（批量请求太大也会拖垮节点）
#   5. 两台节点：lab-eth1 主，lab-eth2 备（backup），主节点连不上或 5xx 时自动切到备
# 能调用哪些 RPC 方法由 Geth 的 --http.api=eth,net,web3 控制，Nginx 不解析请求体。
#
# 检查和生效（lab-eth1）：sudo nginx -t && sudo systemctl reload nginx

# 每个 API Key 每秒 50 个请求，突发 100；没带 Key 的按 IP 限流（实际会在下面被拒绝）
map $http_x_api_key $rpc_client {
    default                         "";
    # 一行一个调用方：key 用 openssl rand -hex 24 生成，不要用下面的示例值
    "REPLACE_WITH_DEPOSIT_SCANNER_KEY"  "deposit-scanner";
    "REPLACE_WITH_WITHDRAW_SERVICE_KEY" "withdraw-service";
    "REPLACE_WITH_OPS_KEY"              "ops";
}
map $rpc_client $rpc_limit_key {
    ""      $binary_remote_addr;
    default $rpc_client;
}
limit_req_zone $rpc_limit_key zone=eth_rpc:10m rate=50r/s;
limit_req_status 429;

upstream eth_rpc_backend {
    server 127.0.0.1:8545 max_fails=3 fail_timeout=10s;
    # 第二台节点的 RPC 要监听内网地址并用防火墙只放行 lab-eth1；没有第二台就注释掉
    server 192.168.56.32:8545 backup;
    keepalive 32;
}

log_format eth_rpc escape=json '{"time":"$time_iso8601","client":"$rpc_client","remote":"$remote_addr",'
                               '"status":$status,"bytes":$body_bytes_sent,"req_len":$request_length,'
                               '"rt":$request_time,"upstream":"$upstream_addr","urt":"$upstream_response_time"}';

server {
    listen 192.168.56.31:8545;
    server_name eth-rpc.lab.local;

    access_log /var/log/nginx/eth-rpc.access.log eth_rpc;
    error_log  /var/log/nginx/eth-rpc.error.log warn;

    # 来源白名单：只允许内网应用网段和 K8s 节点
    allow 192.168.56.0/24;
    allow 127.0.0.1;
    deny  all;

    client_max_body_size 256k;

    # 健康检查：不需要 Key，只返回 Nginx 自身状态
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        if ($rpc_client = "") {
            return 401 '{"jsonrpc":"2.0","error":{"code":-32001,"message":"missing or invalid X-Api-Key"},"id":null}';
        }
        limit_except POST {
            deny all;
        }
        limit_req zone=eth_rpc burst=100 nodelay;

        proxy_pass http://eth_rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        # 不把调用方的 Key 透传给节点
        proxy_set_header X-Api-Key "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # 主节点连接失败、超时、返回 502/503 时，自动重试备节点。
        # 注意：eth_sendRawTransaction 重试到另一台节点是安全的（同一笔签名交易哈希相同，不会重复扣款），
        # 但重试会让同一笔交易被广播两次，日志里看到重复广播不用慌。
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
