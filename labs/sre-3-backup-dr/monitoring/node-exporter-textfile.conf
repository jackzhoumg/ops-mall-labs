# systemd drop-in：给 Lab 09 装的 node_exporter 打开 textfile collector，读取备份脚本写的指标。
# 用法（lab-db1）：
#   sudo install -d -m 755 /var/lib/node_exporter/textfile
#   sudo install -d /etc/systemd/system/node_exporter.service.d
#   sudo install -m 644 monitoring/node-exporter-textfile.conf /etc/systemd/system/node_exporter.service.d/textfile.conf
#   sudo systemctl daemon-reload && sudo systemctl restart node_exporter
#   curl -s localhost:9100/metrics | grep mall_mysql_backup
#
# ExecStart 要先清空再重写，其余参数和 Lab 09 install-exporters.sh 里的保持一致（$$ 是 systemd 里的 $）。
# 服务名或参数不一样的话，先 systemctl cat node_exporter 看原来的 ExecStart。
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100 --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/containers)($$|/) --collector.textfile.directory=/var/lib/node_exporter/textfile
